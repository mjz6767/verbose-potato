<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ashen Halls</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-block">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <h1>Ashen Halls</h1>
          <p>Depth <span id="depthValue">1</span> of the old road</p>
        </div>
      </div>

      <div class="status-strip" aria-label="Company resources">
        <div><span>Gold</span><strong id="goldValue">0</strong></div>
        <div><span>Supplies</span><strong id="suppliesValue">0</strong></div>
        <div><span>Elixirs</span><strong id="elixirValue">0</strong></div>
        <div><span>Mode</span><strong id="modeValue">Explore</strong></div>
      </div>

      <div class="top-actions">
        <button id="saveBtn" type="button">Save</button>
        <button id="loadBtn" type="button">Load</button>
        <button id="newBtn" type="button">New</button>
      </div>
    </header>

    <main class="game-layout">
      <section class="play-column" aria-label="Game board">
        <div class="canvas-frame">
          <canvas id="gameCanvas" width="960" height="640" aria-label="Ashen Halls game board"></canvas>
          <div id="sceneBanner" class="scene-banner" hidden></div>
        </div>

        <div class="command-bar" aria-label="Commands">
          <div class="direction-pad" aria-label="Movement">
            <button type="button" data-dir="north">N</button>
            <button type="button" data-dir="west">W</button>
            <button type="button" data-dir="east">E</button>
            <button type="button" data-dir="south">S</button>
          </div>

          <div class="command-group">
            <button id="campBtn" type="button">Camp</button>
            <button id="descendBtn" type="button">Descend</button>
            <button id="potionBtn" type="button">Elixir</button>
            <button id="moveBtn" type="button">Move</button>
            <button id="attackBtn" type="button">Attack</button>
            <button id="castBtn" type="button">Cast</button>
            <button id="guardBtn" type="button">Guard</button>
            <button id="waitBtn" type="button">Wait</button>
          </div>
        </div>
      </section>

      <aside class="side-column">
        <section class="panel">
          <div class="panel-head">
            <h2>Company</h2>
            <span id="turnBadge">Ready</span>
          </div>
          <div id="partyList" class="party-list"></div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>Opposition</h2>
            <span id="roundBadge">Round 1</span>
          </div>
          <div id="enemyList" class="enemy-list"></div>
        </section>

        <section class="panel log-panel">
          <div class="panel-head">
            <h2>Chronicle</h2>
            <span id="actionBadge">Explore</span>
          </div>
          <div id="logList" class="log-list" aria-live="polite"></div>
        </section>
      </aside>
    </main>
  </div>

  <script src="game.js"></script>
</body>
</html>
